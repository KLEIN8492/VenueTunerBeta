<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VenueTuner · Live</title>
  <style>
    .toolbar { display: flex; gap: 10px; padding: 6px 8px; border-bottom: 1px solid var(--line); align-items: center; }
    #muteAll { font-size: 14px; padding: 6px 18px; font-weight: 700; }
    .strips { flex: 1; display: flex; overflow-x: auto; min-width: 0; }
    .strip { width: 132px; flex: none; border-right: 1px solid var(--line); padding: 6px; display: flex; flex-direction: column; gap: 4px; }
    .strip.sel { background: #202326; }
    .strip .name { border-top: 3px solid; padding-top: 3px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meters { display: flex; gap: 4px; height: 96px; }
    .meter { width: 14px; background: #0c0d0e; border: 1px solid var(--line); position: relative; }
    .meter .fill { position: absolute; bottom: 0; left: 0; right: 0; background: var(--ok); }
    .meter .fill.hot { background: var(--warn); }
    .meter .fill.clip { background: var(--bad); }
    .meter.gr .fill { top: 0; bottom: auto; background: var(--warn); }
    .scale { font-size: 9px; color: var(--dim); display: flex; flex-direction: column; justify-content: space-between; }
    .strip .row > label { min-width: 34px; }
    .strip input[type=number] { width: 58px; }
    .snap { width: 280px; border-left: 1px solid var(--line); padding: 4px 10px; background: var(--panel); overflow-y: auto; }
    .vals { font-size: 10px; color: var(--dim); }
    .top { display: flex; height: 330px; flex: none; border-bottom: 1px solid var(--line); min-height: 0; }
    #editor { flex: 1; min-height: 0; }
    .eq { display: flex; height: 100%; }
    .eq-graphs { flex: 1; display: grid; grid-template-rows: minmax(0, 64fr) minmax(0, 36fr); min-width: 0; }
    .eq-graphs .cv { position: relative; min-height: 0; border-bottom: 1px solid var(--line); }
    .eq-graphs canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .eq-side { width: 390px; border-left: 1px solid var(--line); padding: 4px 10px 12px; overflow-y: auto; background: var(--panel); }
    .eqt td, .eqt th { padding: 1px 3px; }
    .eqt select { padding: 1px 2px; }
    tr.sel td { background: #3a3220; }
    .strip .name { cursor: pointer; }
    .strip .patch { font-size: 10px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .strip .patch.none { color: var(--warn); }
    .modal { position: fixed; inset: 0; background: #000a; display: flex; align-items: center; justify-content: center; z-index: 10; }
    .modal > div { background: var(--panel); border: 1px solid var(--line); padding: 12px 16px; max-height: 85vh; overflow: auto; min-width: 520px; }
    .modal td select { max-width: 240px; }
  </style>
</head>
<body>
  <div class="app">
    <div class="statusbar" id="status"></div>
    <div id="banner"></div>
    <div class="toolbar">
      <button id="muteAll">MUTE ALL</button>
      <span id="splLive" class="big" style="min-width:120px"></span>
      <span id="limLive" title="click to set the limits" style="cursor:pointer"></span>
      <span id="limPanel" hidden>
        <label><input type="checkbox" id="limOn"/> limits</label>
        <select id="limPreset"><option value="fr">France 2017 (102 dB(A) / 118 dB(C))</option><option value="kids">France 2017, under-6s (94 / 104)</option><option value="custom">custom</option></select>
        LAeq 15′ <input type="number" id="limA" step="0.5" style="width:54px"/> LCeq 15′ <input type="number" id="limC" step="0.5" style="width:54px"/>
      </span>
      <button id="airBtn" title="Air absorption compensation">AIR off</button>
      <span id="airPanel" hidden><label><input type="checkbox" id="airOn"/> on</label>
        <input type="number" id="airT" step="0.5" style="width:56px"/>°C <input type="number" id="airH" step="1" style="width:50px"/>% RH
        <button id="airRef" title="store the current conditions as those of the tuning">Tuned now</button>
        <span id="airRefTxt" class="dim"></span></span>
      <button id="undoBtn" title="Undo (⌘Z)">↶</button><button id="redoBtn" title="Redo (⇧⌘Z)">↷</button>
      <span class="dim">Click a strip name to edit its filters · ⌘-click: multi-select · hold ⇧ while changing a value to apply it to all selected</span>
    </div>
    <div class="top">
      <div class="strips" id="strips"></div>
      <div class="snap" id="snap"></div>
    </div>
    <div id="editor"></div>
    <div id="modal"></div>
  </div>
  <script type="module" src="./src/live.ts"></script>
</body>
</html>
