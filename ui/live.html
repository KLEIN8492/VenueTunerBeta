<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VenueTuner · Live</title>
  <style>
    .toolbar { display: flex; gap: 10px; padding: 6px 8px; border-bottom: 1px solid var(--line); align-items: center; }
    #muteAll { font-size: 14px; padding: 6px 18px; font-weight: 700; }
    .strips { flex: 1; display: flex; overflow-x: auto; min-width: 0; }
    .strip { width: 132px; flex: none; border-right: 1px solid var(--line); padding: 6px; display: flex; flex-direction: column; gap: 4px; }
    .strip.sel { background: #202326; }
    .strip .name { border-top: 3px solid; padding-top: 3px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meters { display: flex; gap: 4px; height: 160px; }
    .meter { width: 14px; background: #0c0d0e; border: 1px solid var(--line); position: relative; }
    .meter .fill { position: absolute; bottom: 0; left: 0; right: 0; background: var(--ok); }
    .meter .fill.hot { background: var(--warn); }
    .meter .fill.clip { background: var(--bad); }
    .meter.gr .fill { top: 0; bottom: auto; background: var(--warn); }
    .scale { font-size: 9px; color: var(--dim); display: flex; flex-direction: column; justify-content: space-between; }
    .strip .row > label { min-width: 34px; }
    .strip input[type=number] { width: 58px; }
    .snap { width: 280px; border-left: 1px solid var(--line); padding: 4px 10px; background: var(--panel); overflow-y: auto; }
    .vals { font-size: 10px; color: var(--dim); }
  </style>
</head>
<body>
  <div class="app">
    <div class="statusbar" id="status"></div>
    <div id="banner"></div>
    <div class="toolbar">
      <button id="muteAll">MUTE ALL</button>
      <span class="dim">Click a strip name to select · Linked edit: hold ⇧ while changing a value to apply to all selected</span>
    </div>
    <div class="main">
      <div class="strips" id="strips"></div>
      <div class="snap" id="snap"></div>
    </div>
  </div>
  <script type="module" src="./src/live.ts"></script>
</body>
</html>
